name: Channel analysis

# Weekly retention / views report (scripts/analyze.mjs). Runs on GitHub so it needs no local files: the YouTube secrets
# (token with the youtube + yt-analytics.readonly scopes) already live here. The report is committed to reports/.
on:
  schedule:
    - cron: "0 5 * * 6"      # Saturdays 08:00 TRT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the report
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: node scripts/analyze.mjs
      - name: Commit the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || git commit -m "report: channel analysis [skip ci]"
          git pull --rebase --autostash || true
          git push || true
