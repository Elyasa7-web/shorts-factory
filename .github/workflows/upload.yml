name: Upload Short

on:
  # GitHub's own cron is best-effort and can be delayed or skipped under load.
  # cron-job.org calls workflow_dispatch as the reliable trigger; run.mjs skips
  # the cycle if a video was already uploaded within MIN_GAP_HOURS, so both
  # triggers together never double-post.
  schedule:
    - cron: "7 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System packages (ffmpeg, offline voice, Chrome libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng libnss3 libdbus-1-3 libatk1.0-0 \
            libatk-bridge2.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev \
            libxfixes3 libxcomposite1 libxdamage1 libcups2

      - run: pip install edge-tts
      - run: npm ci

      - name: Cache Remotion's headless Chrome
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: node node_modules/@remotion/cli/remotion-cli.js browser ensure

      - name: Make and upload the video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PUBLISH_HOURS_UTC: ${{ vars.PUBLISH_HOURS_UTC }}
        run: node scripts/run.mjs

      # Persist which topics were used and what is scheduled, even if the upload step failed.
      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/schedule.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: update history and schedule [skip ci]"
          git pull --rebase --autostash || true
          git push || true
