name: Upload Short

on:
  # GitHub's own cron is best-effort and can be delayed or skipped under load.
  # cron-job.org calls workflow_dispatch as the reliable trigger; run.mjs skips
  # the cycle if a video was already uploaded within MIN_GAP_HOURS, so both
  # triggers together never double-post.
  schedule:
    - cron: "7 * * * *"   # hourly; run.mjs only makes a video while the schedule queue is short
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the video but do not upload (for testing)"
        type: boolean
        default: false
      force:
        description: "Upload even if a video was uploaded recently (testing)"
        type: boolean
        default: false
      test_format:
        description: "Testing only: which video to build (auto = normal alternation)"
        type: choice
        options: [auto, story, story-fixture, ranking, manual-test]
        default: auto

permissions:
  contents: write
  actions: write     # lets a finished run start the next one (the daily batch)

concurrency:
  group: upload
  cancel-in-progress: false

jobs:
  short:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ffmpeg comes as a prebuilt static binary: apt-installing it pulled ~100 packages and
      # sometimes stalled for minutes on the Ubuntu mirror, which is unacceptable unattended.
      - name: ffmpeg (static build)
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: System packages (offline voice, Chrome libs, emoji font)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=20 install -y --no-install-recommends espeak-ng libnss3 libdbus-1-3 libatk1.0-0 libatk-bridge2.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libcups2 fonts-noto-color-emoji

      - run: pip install edge-tts
      - run: npm ci

      - name: Cache Remotion's headless Chrome
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: node node_modules/@remotion/cli/remotion-cli.js browser ensure

      - name: Make and upload the video
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          GH_TOKEN: ${{ github.token }}   # lets run.mjs publish manual-upload packages as releases
          PUBLISH_HOURS_UTC: ${{ vars.PUBLISH_HOURS_UTC }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          FORCE: ${{ (inputs.force || inputs.dry_run) && '1' || '' }}
          # story-fixture builds a story from a built-in script: tests visuals, voice and render without Gemini text
          FORMAT: ${{ (inputs.test_format == 'story' || inputs.test_format == 'story-fixture') && 'story' || (inputs.test_format == 'ranking' && 'ranking' || '') }}
          STORY_FIXTURE: ${{ (inputs.test_format == 'story-fixture' || inputs.test_format == 'manual-test') && '1' || '' }}
          TEST_MANUAL: ${{ inputs.test_format == 'manual-test' && '1' || '' }}
        run: node scripts/run.mjs

      # Persist which topics were used and what is scheduled, even if the upload step failed.
      - name: Keep the test video
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: test-video
          path: out/final.mp4
          retention-days: 2

      - name: Save state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json data/schedule.json data/playlists.json data/playlist-queue.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "state: update history and schedule [skip ci]"
          git pull --rebase --autostash || true
          git push || true

      # Daily batch: while today's target (6 videos per YouTube quota day) is not reached, start the next run right away
      # instead of waiting for the next hourly trigger. The state above is already pushed, so the next run sees it.
      # A failed run leaves no flag, so a broken day never loops; the hourly triggers simply try again.
      - name: Continue the batch
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f out/continue-batch ]; then
            echo "Video $(cat out/continue-batch) of today's batch is done: starting the next run"
            gh workflow run upload.yml --ref "${{ github.ref_name }}"
          else
            echo "No further run needed now."
          fi
